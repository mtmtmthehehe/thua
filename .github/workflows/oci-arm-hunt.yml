name: OCI ARM slot catcher

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: oci-arm-hunt
  cancel-in-progress: false

jobs:
  attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install OCI CLI
        run: |
          pipx install oci-cli || pip install --user --break-system-packages oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write OCI config and API key
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=ap-singapore-1
          key_file=~/.oci/oci_api_key.pem
          EOF
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Check if instance already exists
        id: existing
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          id=$(oci compute instance list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --display-name arm-free-max \
            --all \
            --query 'data[?"lifecycle-state"!=`"TERMINATED"` && "lifecycle-state"!=`"TERMINATING"`] | [0].id' \
            --raw-output 2>/dev/null || true)
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            echo "Instance already exists — failing run so only a fresh creation counts as success."
            exit 1
          else
            echo "id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Try to launch instance
        if: steps.existing.outputs.id == ''
        id: launch
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          SSH_PUBKEY: 'ssh-rsa  ssh-key-2026-10-24'
        run: |
          set +e
          ocid=$(oci compute instance launch \
            --availability-domain 'Ihvr:AP-SINGAPORE-1-AD-1' \
            --compartment-id "$OCI_TENANCY_OCID" \
            --display-name arm-free-max \
            --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --image-id 'ocid1.image.oc1.ap-singapore-1.aaaaaaaaw75ef2chh5goomskvdznqz36cadczqelqvndbqcozc5icyig57za' \
            --subnet-id "$OCI_SUBNET_OCID" \
            --assign-public-ip true \
            --metadata "{\"ssh_authorized_keys\": \"$SSH_PUBKEY\"}" \
            --query 'data.id' --raw-output 2>launch_err.txt)
          if [ -n "$ocid" ] && [ "$ocid" != "null" ]; then
            echo "result=created" >> "$GITHUB_OUTPUT"
            echo "ocid=$ocid" >> "$GITHUB_OUTPUT"
            echo "Instance created."
          elif grep -q 'Out of host capacity' launch_err.txt; then
            echo "Out of host capacity — failing run (no instance created)."
            exit 1
          elif grep -q 'TooManyRequests' launch_err.txt; then
            echo "Rate limited (TooManyRequests) — failing run (no instance created)."
            exit 1
          else
            echo "Launch failed — failing run (no instance created)."
            cat launch_err.txt
            exit 1
          fi

      - name: On success - resize boot volume, open signal issue
        if: steps.launch.outputs.result == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCID: ${{ steps.launch.outputs.ocid }}
        run: |
          # Mo rong boot volume len 200GB (muc free toi da). Loi thi bo qua, lam tay sau.
          bvid=$(oci compute boot-volume-attachment list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --instance-id "$OCID" \
            --query 'data[0]."boot-volume-id"' --raw-output 2>/dev/null || true)
          if [ -n "$bvid" ] && [ "$bvid" != "null" ]; then
            oci bv boot-volume update --boot-volume-id "$bvid" --size-in-gbs 200 \
              || echo "Boot volume resize skipped (will do manually)."
          fi
          # Chi mo issue bao tin hieu, KHONG ghi IP hay OCID vi repo public, ai cung doc duoc.
          # IP lay trong OCI Console: Compute -> Instances -> arm-free-max -> Public IP.
          gh issue create \
            --title "VPS Oracle free da tao thanh cong" \
            --body "Instance arm-free-max da duoc tao (VM.Standard.A1.Flex, 2 OCPU / 12GB RAM). Boot volume se duoc mo rong len 200GB, neu loi thi lam tay sau.
          Khong ghi IP/OCID o day vi repo public.
          Lay IP trong OCI Console: Compute -> Instances -> arm-free-max -> Public IP, roi SSH bang private key cua m.
          Viec can lam ngay: tat workflow nay (Actions -> workflow -> Disable) va tat cronjob dispatch."
