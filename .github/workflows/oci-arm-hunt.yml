name: OCI ARM slot catcher

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: oci-arm-hunt
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}   # bat buoc: job khong checkout nen gh khong tu biet repo
  SUCCESS_TITLE: "VPS Oracle free da tao thanh cong"
  ERROR_TITLE: "OCI workflow loi can sua"

jobs:
  attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install OCI CLI
        run: |
          pipx install oci-cli || pip install --user --break-system-packages oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write OCI config and API key
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=ap-singapore-1
          key_file=~/.oci/oci_api_key.pem
          EOF
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      # state = none (chua co) | exists (da co) | error (khong kiem tra duoc)
      - name: Check if instance already exists
        id: existing
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          if id=$(oci compute instance list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --display-name arm-free-max \
              --all \
              --query 'data[?"lifecycle-state"!=`"TERMINATED"` && "lifecycle-state"!=`"TERMINATING"`] | [0].id' \
              --raw-output 2>/tmp/check_err.txt); then
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              echo "state=exists" >> "$GITHUB_OUTPUT"
            else
              echo "state=none" >> "$GITHUB_OUTPUT"
            fi
          else
            # loi auth / cau hinh / mang. Xoa OCID truoc khi luu vi repo public.
            sed -E 's/ocid1\.[A-Za-z0-9._-]+/<ocid>/g' /tmp/check_err.txt | head -n 25 > /tmp/oci_error.txt
            echo "state=error" >> "$GITHUB_OUTPUT"
          fi

      # result = created | capacity | ratelimit | error. Luon exit 0 de cac buoc sau chay; buoc cuoi moi quyet dinh do/xanh.
      - name: Try to launch instance
        if: steps.existing.outputs.state == 'none'
        id: launch
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          SSH_PUBKEY: 'ssh-rsa  ssh-key-2026-10-24'
        run: |
          set +e
          ocid=$(oci compute instance launch \
            --availability-domain 'Ihvr:AP-SINGAPORE-1-AD-1' \
            --compartment-id "$OCI_TENANCY_OCID" \
            --display-name arm-free-max \
            --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":1,"memoryInGBs":6}' \
            --image-id 'ocid1.image.oc1.ap-singapore-1.aaaaaaaaw75ef2chh5goomskvdznqz36cadczqelqvndbqcozc5icyig57za' \
            --subnet-id "$OCI_SUBNET_OCID" \
            --assign-public-ip true \
            --metadata "{\"ssh_authorized_keys\": \"$SSH_PUBKEY\"}" \
            --query 'data.id' --raw-output 2>/tmp/launch_err.txt)
          sed -E 's/ocid1\.[A-Za-z0-9._-]+/<ocid>/g' /tmp/launch_err.txt | head -n 25 > /tmp/oci_error.txt

          if [ -n "$ocid" ] && [ "$ocid" != "null" ]; then
            echo "result=created" >> "$GITHUB_OUTPUT"
            echo "ocid=$ocid" >> "$GITHUB_OUTPUT"
          elif grep -qi 'Out of host capacity' /tmp/launch_err.txt; then
            echo "result=capacity" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'TooManyRequests|"status": 429' /tmp/launch_err.txt; then
            echo "result=ratelimit" >> "$GITHUB_OUTPUT"
          else
            echo "result=error" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Resize boot volume to 200GB
        if: steps.launch.outputs.result == 'created'
        continue-on-error: true
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCID: ${{ steps.launch.outputs.ocid }}
        run: |
          # Co the chua attach ngay sau khi launch, thu lai vai lan.
          bvid=""
          for i in 1 2 3 4 5 6; do
            bvid=$(oci compute boot-volume-attachment list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --availability-domain 'Ihvr:AP-SINGAPORE-1-AD-1' \
              --instance-id "$OCID" \
              --query 'data[0]."boot-volume-id"' --raw-output 2>/dev/null || true)
            [ -n "$bvid" ] && [ "$bvid" != "null" ] && break
            sleep 20
          done
          if [ -n "$bvid" ] && [ "$bvid" != "null" ]; then
            oci bv boot-volume update --boot-volume-id "$bvid" --size-in-gbs 200 \
              && echo "RESIZED=yes" >> "$GITHUB_ENV" \
              || { echo "::warning title=Boot volume resize failed::Lam tay trong OCI Console"; echo "RESIZED=no" >> "$GITHUB_ENV"; }
          else
            echo "::warning title=Boot volume not found::Lam tay trong OCI Console"
            echo "RESIZED=no" >> "$GITHUB_ENV"
          fi

      # Mo issue khi VPS vua tao xong, hoac khi phat hien VPS da ton tai ma chua co issue (luoi an toan).
      - name: Open success issue
        if: steps.launch.outputs.result == 'created' || steps.existing.outputs.state == 'exists'
        env:
          STATE: ${{ steps.existing.outputs.state }}
        run: |
          if [ "$STATE" = "exists" ]; then
            n=$(gh issue list --state all --search "\"$SUCCESS_TITLE\" in:title" --json number --jq length)
            if [ "$n" != "0" ]; then
              echo "Success issue already exists, skipping."
              exit 0
            fi
          fi
          if [ "${RESIZED:-no}" = "yes" ]; then
            vol="Boot volume da duoc mo rong len 200GB."
          else
            vol="Boot volume CHUA mo rong duoc, lam tay trong OCI Console."
          fi
          {
            echo "Instance arm-free-max (VM.Standard.A1.Flex, 1 OCPU / 6GB RAM) da ton tai ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "$vol"
            echo
            echo "Khong ghi IP/OCID o day vi repo public."
            echo "Lay IP trong OCI Console: Compute -> Instances -> arm-free-max -> Public IP, roi SSH bang private key cua m."
            echo
            echo "Viec can lam ngay: tat workflow nay (Actions -> workflow -> Disable) va tat cronjob dispatch."
          } > /tmp/body.md
          gh issue create --title "$SUCCESS_TITLE" --body-file /tmp/body.md

      # Loi that (khong phai het slot / rate limit): mo 1 issue, khong spam neu da co issue dang mo.
      - name: Open error issue
        if: steps.existing.outputs.state == 'error' || steps.launch.outputs.result == 'error'
        env:
          WHERE: ${{ steps.existing.outputs.state == 'error' && 'kiem tra instance (oci compute instance list)' || 'tao instance (oci compute instance launch)' }}
        run: |
          n=$(gh issue list --state open --search "\"$ERROR_TITLE\" in:title" --json number --jq length)
          if [ "$n" != "0" ]; then
            echo "Error issue already open, skipping."
            exit 0
          fi
          {
            echo "Workflow gap loi o buoc: $WHERE"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Loi tu OCI (da xoa OCID):"
            echo '```'
            cat /tmp/oci_error.txt
            echo '```'
            echo
            echo "Cac loi thuong gap: sai fingerprint/private key (401 NotAuthenticated), sai OCID/subnet/image (404 NotAuthorizedOrNotFound), sai availability domain."
            echo "Het slot (Out of host capacity) va rate limit KHONG tao issue, do la binh thuong."
          } > /tmp/err_body.md
          gh issue create --title "$ERROR_TITLE" --body-file /tmp/err_body.md

      # Buoc cuoi: chi xanh khi VPS vua duoc tao. Moi truong hop khac do voi ly do ro rang.
      - name: Final status
        if: always()
        env:
          STATE: ${{ steps.existing.outputs.state }}
          RESULT: ${{ steps.launch.outputs.result }}
        run: |
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$RESULT" = "created" ]; then
            summary "### CREATED - VPS da tao thanh cong, xem issue moi trong tab Issues"
            exit 0
          elif [ "$STATE" = "exists" ]; then
            summary "### EXISTS - instance arm-free-max da ton tai, khong tao them. Hay tat workflow."
            echo "::error title=Instance already exists::arm-free-max da ton tai. Tat workflow nay."
          elif [ "$RESULT" = "capacity" ]; then
            summary "### NO CAPACITY - Out of host capacity, thu lai lan sau (binh thuong)"
            echo "::error title=Out of host capacity::OCI het slot ARM o AD-1. Khong co gi sai, cho lan chay sau."
          elif [ "$RESULT" = "ratelimit" ]; then
            summary "### RATE LIMITED - OCI tra TooManyRequests, giam tan suat dispatch"
            echo "::error title=Rate limited::OCI TooManyRequests (429). Giam tan suat chay."
          else
            summary "### REAL ERROR - khong phai het slot, can sua cau hinh"
            summary '```'
            summary "$(cat /tmp/oci_error.txt 2>/dev/null)"
            summary '```'
            echo "::error title=OCI error::$(head -c 400 /tmp/oci_error.txt 2>/dev/null | tr '\n' ' ')"
          fi
          exit 1