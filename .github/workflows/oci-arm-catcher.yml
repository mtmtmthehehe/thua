name: OCI ARM slot catcher

# San slot Oracle Always Free: VM.Standard.A1.Flex, 2 OCPU / 12GB, ap-singapore-1.
# Moi luot chay = 1 lan thu tao instance arm-free-max.
# - Het slot: Oracle tra "Out of host capacity", job thoat binh thuong, luot sau thu lai.
# - Trung slot: job lay public IP, mo rong boot volume len 200GB, mo issue bao
#   OCID + IP. Cac luot sau tu bo qua nho buoc kiem tra instance da ton tai.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]


concurrency:
  group: oci-arm-catcher
  cancel-in-progress: false

jobs:
  attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install OCI CLI
        run: |
          pipx install oci-cli || pip install --user --break-system-packages oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write OCI config and API key
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=ap-singapore-1
          key_file=~/.oci/oci_api_key.pem
          EOF
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Check if instance already exists
        id: existing
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          id=$(oci compute instance list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --display-name arm-free-max \
            --lifecycle-state RUNNING \
            --lifecycle-state PROVISIONING \
            --query 'data[0].id' --raw-output 2>/dev/null || true)
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            echo "id=$id" >> "$GITHUB_OUTPUT"
            echo "Instance already exists: $id — skipping launch."
          else
            echo "id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Try to launch instance
        if: steps.existing.outputs.id == ''
        id: launch
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          SSH_PUBKEY: 'ssh-rsa  ssh-key-2026-10-24'
        run: |
          set +e
          ocid=$(oci compute instance launch \
            --availability-domain 'Ihvr:AP-SINGAPORE-1-AD-1' \
            --compartment-id "$OCI_TENANCY_OCID" \
            --display-name arm-free-max \
            --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --image-id 'ocid1.image.oc1.ap-singapore-1.aaaaaaaaw75ef2chh5goomskvdznqz36cadczqelqvndbqcozc5icyig57za' \
            --subnet-id "$OCI_SUBNET_OCID" \
            --assign-public-ip true \
            --metadata "{\"ssh_authorized_keys\": \"$SSH_PUBKEY\"}" \
            --query 'data.id' --raw-output 2>launch_err.txt)
          if [ -n "$ocid" ] && [ "$ocid" != "null" ]; then
            echo "result=created" >> "$GITHUB_OUTPUT"
            echo "ocid=$ocid" >> "$GITHUB_OUTPUT"
            echo "Created: $ocid"
          elif grep -q 'Out of host capacity' launch_err.txt; then
            echo "result=capacity" >> "$GITHUB_OUTPUT"
            echo "Out of host capacity — will retry next run."
          else
            echo "result=error" >> "$GITHUB_OUTPUT"
            cat launch_err.txt
            exit 1
          fi

      - name: On success - get IP, resize boot volume, open issue
        if: steps.launch.outputs.result == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCID: ${{ steps.launch.outputs.ocid }}
        run: |
          vnic=$(oci compute instance list-vnic-attachments \
            --compartment-id "$OCI_TENANCY_OCID" \
            --instance-id "$OCID" \
            --query 'data[0]."vnic-id"' --raw-output)
          ip=$(oci network vnic get --vnic-id "$vnic" --query 'data."public-ip"' --raw-output)
          echo "Public IP: $ip"
          # Mo rong boot volume len 200GB (muc free toi da). Loi thi bo qua, lam tay sau.
          bvid=$(oci compute boot-volume-attachment list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --instance-id "$OCID" \
            --query 'data[0]."boot-volume-id"' --raw-output 2>/dev/null || true)
          if [ -n "$bvid" ] && [ "$bvid" != "null" ]; then
            oci bv boot-volume update --boot-volume-id "$bvid" --size-in-gbs 200 \
              || echo "Boot volume resize skipped (will do manually)."
          fi
          gh issue create \
            --title "VPS Oracle free da tao thanh cong" \
            --body "Instance arm-free-max da duoc tao.
          - OCID: $OCID
          - Shape: VM.Standard.A1.Flex, 2 OCPU / 12GB RAM, Ubuntu 24.04
          - Public IP: $ip
          - SSH: ssh -i <private-key> ubuntu@$ip
          Sau khi thay issue nay: tat workflow nay di (Actions -> workflow -> Disable), roi bao cho agent de nhan private key va kiem tra lai."
